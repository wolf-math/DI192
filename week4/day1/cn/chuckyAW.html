<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuck Norris</title>
</head>
<body>
  <h1>Chuck Norris</h1>
  <button id="btn">Click for a joke!</button>
  <p id="joke"></p>
  
  <script defer>

    let joke = document.getElementById('joke')
    let btn = document.getElementById('btn')
    btn.addEventListener('click', getJoke)

    async function getJoke() {
      try {
        const response = await fetch('https://api.chucknorris.io/jokes/random?category=dev')
        if (response.ok) {
          let jsonJoke = await response.json()
          let displayJoke = jsonJoke.value
          joke.innerText = displayJoke
        } else {
          throw new Error ("didn't get the joke!")
        }
      } catch {
        console.log("there was an error")
      }
    }

  </script>
</body>
</html>
