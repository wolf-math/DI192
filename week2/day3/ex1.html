<!DOCTYPE html>
<html lang="en">
<head>
  <title>Ex1</title>
</head>
<body>
  <input type="button" onclick="insertRow()" value="Insert row"> 
  <table id="sampleTable" border="1"> 
    <tr>
        <td>Row1 cell1</td> 
        <td>Row1 cell2</td>
    </tr> 
    <tr>
        <td>Row2 cell1</td> 
        <td>Row2 cell2</td>
    </tr> 
  </table>

  <script>
    let rowNum = 3
    function insertRow(){
      const row = document.createElement('tr')
      row.innerHTML = `<td>Row${rowNum} cell1</td> <td>Row${rowNum} cell2</td>`
      const table = document.getElementById('sampleTable')
      table.appendChild(row)
      rowNum++ 
    }
  </script>
</body>
</html>
