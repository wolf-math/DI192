  <h1>Classes</h1>
  <script>

    class Rectangle {
      constructor(height, width) {
        this.height = height;
        this.width = width;
      }

      getArea() {
        this.area = this.height * this.width
        return this.height * this.width  
      } 
    }

    // Exercise
    // Analyse the code below. Display the type of each rabbit and make them speak

    class Rabbit {
      constructor(type) {
        this.type = type;
      }

      speak(line) {
        console.log(`The ${this.type} rabbit says '${line}'`);
      }

      hop(distance) {
        console.log(`The ${this.type} rabbit jumped ${distance} meters.`)
      }
    }

    let killerRabbit = new Rabbit("killer");
    let blackRabbit = new Rabbit("black");

    console.log(killerRabbit.type)
    killerRabbit.speak('I like DI192')

    console.log(blackRabbit.type)
    blackRabbit.speak('Twelve + 12 = Twenty 4')

    blackRabbit.hop(10)
