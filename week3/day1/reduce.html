<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reduce</title>
</head>
<body>
  <h1>Reduce</h1>

  <script>
    const arr = [1, 4, 9, 16];

  let sum = arr.reduce((acc, val) => {
    console.log(`acc: ${acc}`)
    console.log(`val: ${val}`)
    console.log(`acc * val: ${acc * val}`);
    return acc * val;
  });

  console.log(sum)

  </script>
</body>
</html>
