<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter</title>
</head>
<body>
  <h1>filter</h1>
  
  <script>
    const numbers = [1,2,13,15,12,22,72,99, 101, 999, 57]

    // multiples of 3
    const mult3 = numbers.filter((num)=> num % 3 == 0)
    console.log(mult3)

    // double digits
    const dd = numbers.filter(num => (num >= 10 && num < 100))
    console.log(dd)
  </script>
</body>
</html>
