<!DOCTYPE html>
<html lang="en">
<head>

  <title>Map</title>

<body>
  <h1>Map</h1>

  <script>
    // const numbers = [4,5,6,7,8,9]

    // // It looks like map and forEach are the same!
    // numbers.forEach(num => console.log(num * 2))
    // // numbers.map(num => console.log(num * 2))

    // // but they're not
    // const numsForEach = numbers.forEach(num => num * 2) // undefined
    // const numsMap = numbers.map(num => num * 2) // new array

    // console.log(numsForEach)
    // console.log(numsMap)

    // // forEach works over an array
    // // map returns a new array

    const firstArr = [1, 4, 9, 16];

    
    const secondArr = firstArr.map((value, index, arr) => {
      console.log(value); // each element
      console.log(index); // each index
      console.log(arr); // the firstArr (logged 4 times)
      return value * index;
    });
    
    // 1 x 0
    // 4 x 1
    // 9 x 2
    // 16 x 3
    // [0, 4, 18, 48]
    console.log(secondArr);
  </script>
